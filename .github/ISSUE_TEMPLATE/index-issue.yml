name: Report an index issue
description: Report a problem with public package metadata or index tooling
body:
  - type: markdown
    attributes:
      value: For a private security report, follow SECURITY.md. Avoid posting exploit details here.
  - type: input
    id: release
    attributes:
      label: Package and exact version
      placeholder: publisher/package@1.0.0
  - type: textarea
    id: evidence
    attributes:
      label: What happened?
      description: Include the validator error, relevant links, and reproduction steps.
    validations:
      required: true
