name: Label Bunko pull requests

# Runs the workflow from the trusted base branch, including for fork PRs.
# Never check out, download, or execute untrusted PR code in this workflow.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Classify pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Apply metadata-only labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const issue_number = pr.number;

            const typeLabels = [
              'type: new-package 🍓',
              'type: new-version 🆙',
              'type: revocation 🚫',
              'type: documentation 📚',
              'type: infrastructure ⚙️',
              'type: policy 📜',
            ];
            const statusLabels = [
              'status: awaiting-review 👀',
              'status: reviewing 🔍',
              'status: changes-requested 📝',
              'status: ready-to-merge ✅',
              'status: blocked ⛔',
            ];

            // Read file *names*, not fork-controlled file contents.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number, per_page: 100,
            });
            if (files.length >= 3000) {
              throw new Error('PR file list may be truncated; classify manually.');
            }
            const paths = files.map(file => file.filename);
            const addedPackages = files.filter(file =>
              file.status === 'added' &&
              /^packages\/[a-z0-9-]+\/[a-z0-9-]+\/[0-9]+\.[0-9]+\.[0-9]+\.toml$/.test(file.filename)
            );

            const desiredTypes = new Set();
            const changesInfrastructure = paths.some(path =>
              path.startsWith('.github/') ||
              path.startsWith('tools/') ||
              path.startsWith('schemas/') ||
              path.startsWith('tests/')
            );
            const changesRevocations = paths.includes('policies/revoked-versions.toml');
            const changesPolicy = paths.some(path => path.startsWith('policies/'));
            const docsOnly = paths.length > 0 && paths.every(path =>
              path.startsWith('docs/') ||
              ['README.md', 'CONTRIBUTING.md', 'SECURITY.md'].includes(path)
            );

            if (changesInfrastructure) {
              desiredTypes.add('type: infrastructure ⚙️');
            } else if (changesRevocations) {
              desiredTypes.add('type: revocation 🚫');
            } else if (changesPolicy) {
              desiredTypes.add('type: policy 📜');
            } else if (addedPackages.length) {
              // Compare with the trusted base tree, not the PR's own tree.
              const { data: tree } = await github.rest.git.getTree({
                owner, repo, tree_sha: pr.base.sha, recursive: '1',
              });
              if (tree.truncated) {
                throw new Error('Base tree is truncated; classify manually.');
              }
              const existing = new Set(tree.tree
                .filter(item => item.type === 'blob' &&
                  /^packages\/[^/]+\/[^/]+\/[^/]+\.toml$/.test(item.path))
                .map(item => item.path.split('/').slice(0, 3).join('/')));
              for (const file of addedPackages) {
                const packageDir = file.filename.split('/').slice(0, 3).join('/');
                desiredTypes.add(existing.has(packageDir)
                  ? 'type: new-version 🆙'
                  : 'type: new-package 🍓');
              }
            } else if (docsOnly) {
              desiredTypes.add('type: documentation 📚');
            }

            const current = new Set((await github.paginate(
              github.rest.issues.listLabelsOnIssue,
              { owner, repo, issue_number, per_page: 100 },
            )).map(label => label.name));

            const add = [...desiredTypes].filter(label => !current.has(label));
            if (!pr.draft && !statusLabels.some(label => current.has(label))) {
              add.push('status: awaiting-review 👀');
            }

            // The validator remains authoritative. This extra hint matches
            // the base branch's current namespace similarity policy.
            if (addedPackages.length) {
              const { data: policyFile } = await github.rest.repos.getContent({
                owner, repo, path: 'policies/similarity-rules.toml', ref: pr.base.sha,
              });
              if (policyFile.type !== 'file' || !policyFile.content) {
                throw new Error('Cannot read trusted namespace similarity policy.');
              }
              const policy = Buffer.from(policyFile.content, 'base64').toString('utf8');
              const patterns = new Map();
              const distances = new Map();
              let section = '';
              for (const raw of policy.split(/\r?\n/)) {
                const line = raw.trim();
                if (!line || line.startsWith('#')) continue;
                const heading = line.match(/^\[([a-z_]+)\]$/);
                if (heading) { section = heading[1]; continue; }
                const expression = line.match(/^([a-z0-9_-]+)\s*=\s*'([^']+)'$/);
                const integer = line.match(/^([a-z0-9_-]+)\s*=\s*(\d+)$/);
                if (section === 'visual_patterns' && expression) {
                  patterns.set(expression[1], new RegExp(`^(?:${expression[2]})$`));
                } else if (section === 'edit_distance' && integer) {
                  distances.set(integer[1], Number(integer[2]));
                }
              }
              if (!patterns.size || !distances.size) {
                throw new Error('Unexpected namespace similarity policy format.');
              }

              // Unrestricted Damerau-Levenshtein distance, like validate.py.
              function distance(a, b) {
                const n = a.length, m = b.length, max = n + m;
                const d = Array.from({ length: n + 2 }, () =>
                  Array(m + 2).fill(0));
                for (let i = 0; i <= n + 1; i++) d[i][0] = max;
                for (let j = 0; j <= m + 1; j++) d[0][j] = max;
                for (let i = 0; i <= n; i++) d[i + 1][1] = i;
                for (let j = 0; j <= m; j++) d[1][j + 1] = j;
                const last = new Map();
                for (let i = 1; i <= n; i++) {
                  let lastMatch = 0;
                  for (let j = 1; j <= m; j++) {
                    const row = last.get(b[j - 1]) || 0;
                    const column = lastMatch;
                    const cost = Number(a[i - 1] !== b[j - 1]);
                    if (cost === 0) lastMatch = j;
                    d[i + 1][j + 1] = Math.min(
                      d[i][j] + cost, d[i + 1][j] + 1,
                      d[i][j + 1] + 1,
                      d[row][column] + (i - row - 1) + 1 + (j - column - 1),
                    );
                  }
                  last.set(a[i - 1], i);
                }
                return d[n + 1][m + 1];
              }

              const namespaces = new Set(addedPackages.map(file =>
                file.filename.split('/')[1]));
              const reserved = new Set([...patterns.keys(), ...distances.keys()]);
              const suspicious = [...namespaces].some(namespace =>
                !reserved.has(namespace) && (
                  [...patterns.values()].some(pattern => pattern.test(namespace)) ||
                  [...distances].some(([name, threshold]) =>
                    distance(namespace, name) <= threshold)
                )
              );
              if (suspicious && !current.has('review: naming 🧐')) {
                add.push('review: naming 🧐');
              }
            }

            // Reconcile only the labels owned by the classifier.
            // Human review, test, and priority labels are never removed here.
            for (const label of typeLabels) {
              if (current.has(label) && !desiredTypes.has(label)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              }
            }
            if (add.length) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: add,
              });
            }
            core.info(`Applied ${add.length} label(s). Maintainer review remains required.`);
